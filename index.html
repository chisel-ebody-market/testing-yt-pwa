<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <title>YouTube PWA</title>
    <style>
        body{
              font-family: 'Courier New', monospace;
        }

      button{
        height: 100px;
        width: 200px;
        background: red;
        border: none;
        border-radius: 0%;
        color: white;
      }

      b{
        font-size: 20px;
      }
    </style>
  </head>
  <body>
    <center>
        <h1>YouTube Web app</h1>
        <hr>
        <a href="https://m.youtube.com/?persist_app=1&app=m"><button><b>Launch YouTube</b></button></a>
    </center>
  </body>
</html>
